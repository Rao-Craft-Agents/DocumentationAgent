<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="generator" content="DocumentationAgent">
<title>{{title}}</title>
<link rel="stylesheet" href="app.css">
<script>
  // The theme before first paint: auto follows the system; a choice is remembered on this machine.
  try { var t = localStorage.getItem('docs-site.theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="shell" id="shell">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="{{title}}, start">
      <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
      <span class="brand-name" id="brand-name">{{title}}</span>
    </a>
    <span class="head-chip" id="head-chip"></span>
    <span class="topbar-spacer"></span>
    <button type="button" class="search-trigger" data-action="search-open" aria-keyshortcuts="Meta+K">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>Search folders, files, types, services, docs</span><kbd>⌘K</kbd>
    </button>
    <div class="segmented" role="radiogroup" aria-label="Theme" id="theme-switch">
      <button type="button" role="radio" data-action="theme" data-value="auto">Auto</button>
      <button type="button" role="radio" data-action="theme" data-value="dark">Dark</button>
      <button type="button" role="radio" data-action="theme" data-value="light">Light</button>
    </div>
    <button type="button" class="icon-button" data-action="settings-toggle" aria-label="Editor settings" aria-expanded="false" id="settings-button">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 4h7M12 4h2M2 12h2M7 12h7M9 2.5v3M5 10.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
    </button>
  </header>
  <nav class="rail" id="rail" aria-label="Folders and views"></nav>
  <main id="main" tabindex="-1"></main>
  <aside class="inspector" id="inspector" aria-label="Details"></aside>
</div>

<div class="search-overlay" id="search" hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search">
    <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="A folder, file, type, function, service, event or doc">
    <div class="search-results" id="search-results" role="listbox"></div>
    <div class="search-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>

<div class="settings-popover" id="settings" hidden>
  <h3 class="eyebrow">Open code in</h3>
  <label class="field" for="setting-scheme">Editor
    <select id="setting-scheme">
      <option value="vscode">VS Code</option>
      <option value="vscode-insiders">VS Code Insiders</option>
      <option value="cursor">Cursor</option>
      <option value="xcode">Xcode</option>
    </select>
  </label>
  <label class="field" for="setting-root">Repository folder
    <input id="setting-root" type="text" spellcheck="false" autocomplete="off">
  </label>
  <p class="hint" id="setting-root-hint"></p>
  <div class="settings-actions">
    <button type="button" class="button" data-action="settings-reset">Use the page's folder</button>
    <button type="button" class="button primary" data-action="settings-save">Save</button>
  </div>
</div>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="folders.js"></script>
<script src="explorer.js"></script>
<!--ask-->
<script src="app.js"></script>
</body>
</html>
